version: '3.8'

services:
  web:
    build: .
    container_name: django_app_container
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      # Sincroniza la carpeta local con la del contenedor para ver cambios en vivo
      - .:/app
    ports:
      # Puerto Host : Puerto Contenedor
      - "8000:8000"
    environment:
      - DEBUG=1